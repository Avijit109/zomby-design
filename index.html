<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
  <nav class="navbar navbar-dark main-navbar bg-black fixed-top">
    <div class="container container-xxl">
      <div class="d-flex align-items-center w-100 justify-content-between">

        <button class="btn p-0" data-bs-toggle="offcanvas" data-bs-target="#leftMenu">
          <img src="../image/home-image/left_bar.webp" class="nav-icon left-bar">
        </button>

        <img src="../image/home-image/brand_logo.webp" class="brand-logo">

        <div class="d-flex gap-3">
          <img src="../image/home-image/user_icon.webp" class="nav-icon user-icon">
          <img src="../image/home-image/cart_icon.webp" class="nav-icon cart-icon">
        </div>

      </div>
    </div>
  </nav>
</header>

<section class="banner_area">

  <div class="container h-100 d-flex flex-column justify-content-center text-center">

    <!-- IMAGE AREA -->
    <div class="banner_text_earphone_area">
      <img src="./image/home-image/banner_text_image_another.png" class="banner_text_image">

      <div class="banner_earphone_image_area">
        <img src="../image/home-image/banner_earphone_image.webp">
      </div>
    </div>

    <!-- TEXT AREA -->
    <div class="banner_text_area">
      <h1 class="banner_text_area_heading">Tune Into Perfection</h1>
      <p class="banner_text_area_des">
        Precision-engineered headphones for the ultimate listening experience.
      </p>
      <button class="discover-btn">Discover more</button>
    </div>

  </div>

  <!-- SIDE BARS -->
  <div class="banner_sidebar_one">
    <img src="./image/banner_bar.png" class="d-none d-lg-block">
    <img src="./image/banner_sidebar_image_mobile.png" class="d-lg-none">
  </div>

  <div class="banner_sidebar_two">
    <img src="./image/banner_bar.png" class="d-none d-lg-block">
    <img src="./image/banner_sidebar_image_mobile.png" class="d-lg-none">
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
